apply plugin: "com.android.library"

android {
    namespace "com.kobakei.ratethisapp"
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 14
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
      release {
        minifyEnabled false
      }
    }
}

dependencies {
    implementation 'com.android.support:appcompat-v7:28.0.0'
}

// Legacy Bintray/JCenter `publish {}` config removed; keep metadata for future publishing migration.
group = 'io.github.kobakei'
version = '1.2.1'
